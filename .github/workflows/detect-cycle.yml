name: PayShield detection cycle

# Runs the scheduled DETECT -> DIAGNOSE -> DECIDE -> ACT -> OBSERVE ->
# ADAPT cycle by calling the deployed FastAPI backend's endpoint.
# Deliberately scheduled, not per-webhook — a rolling-window statistic
# shouldn't recompute on every event. An in-process Python scheduler
# was deliberately NOT used instead: most free-tier Python hosts spin
# the process down after inactivity, which would silently kill an
# in-process scheduler — hitting a public endpoint from GitHub Actions
# is the more reliable ₹0 pattern regardless of backend language.
#
# Requires two repo secrets, set once the backend is deployed:
#   PAYSHIELD_API_URL   - the deployed FastAPI backend's URL, e.g.
#                       https://payshield-api.onrender.com
#   CRON_SECRET       - must match the CRON_SECRET env var set on the
#                       backend host
#
# Before those secrets exist (e.g. right after this repo is first
# pushed, before deployment), the scheduled run below deliberately
# skips the call and exits successfully rather than failing — there is
# nothing wrong to alert on yet, just a step that isn't configured.
# Repo Settings -> Secrets and variables -> Actions -> New repository
# secret is where to add both once the backend is deployed (see
# README's Local setup / Razorpay webhook setup sections).

on:
  schedule:
    - cron: "*/5 * * * *" # every 5 minutes; tighten to */2 if the
      # free-tier Actions minute budget allows it during the demo window
  workflow_dispatch: {} # manual trigger, useful for demo pacing

concurrency:
  # Prevents a manual workflow_dispatch (demo pacing) from overlapping
  # with a scheduled run, or two scheduled runs overlapping if one is
  # delayed — the detection cycle itself is idempotent against
  # re-evaluating an unchanged canonical window (see
  # backend/app/services/agent.py's last_window_end guard), but
  # avoiding concurrent invocations altogether is simpler and cheaper
  # than relying on that alone.
  group: payshield-detection-cycle
  cancel-in-progress: false

jobs:
  run-detection-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Call detection cycle endpoint
        env:
          PAYSHIELD_API_URL: ${{ secrets.PAYSHIELD_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PAYSHIELD_API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping live detection cycle — deployment secrets (PAYSHIELD_API_URL, CRON_SECRET) are not configured yet. This is expected before the backend is deployed."
            exit 0
          fi
          curl -sS -X POST "$PAYSHIELD_API_URL/api/cron/detect" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            --fail-with-body
